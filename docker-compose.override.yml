services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: builder
    command: npm run start:dev
    environment:
      NODE_ENV: development
    volumes:
      - ./backend:/app
      - /app/node_modules
      - /app/dist

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder
    command: npm run dev
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

  scraper:
    command: python -m src.main
    environment:
      LOG_LEVEL: DEBUG
    volumes:
      - ./scraper:/app
